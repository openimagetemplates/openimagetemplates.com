name: Schema version

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check schema version and changelog
        env:
          SCHEMA_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/check-schema-version.mjs
